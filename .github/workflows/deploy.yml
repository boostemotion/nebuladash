# NebulaDash: 上游的 deploy.yml 依赖 release-please + PAT + gh-pages 多字体分支，
# 这些都属于上游仓库自己的发布链路。NebulaDash 只通过 .github/workflows/release.yml
# 在 tag 上产出 Release 附件，因此这里保留一个显式的占位说明，避免误以为发布链路缺失。
#
# 如果需要 NebulaDash 自己的 gh-pages 预览，另开工作流实现，不要恢复上游的矩阵。
name: Build and Deploy (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled workflow
        run: |
          echo "NebulaDash uses .github/workflows/release.yml (tag triggered)."
          echo "Upstream's release-please + gh-pages matrix is intentionally disabled."
