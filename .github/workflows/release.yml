name: Release

# NebulaDash 发布工作流。
# 与上游不同：只由 tag 触发，产出 NebulaDash 自己的 Release 附件，
# 不使用 upstream 的 release-please / gh-pages 分支矩阵。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Release preflight
        run: pnpm release:check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit tracked public files
        shell: bash
        run: |
          forbidden="$(
            git ls-files |
              grep -E '(^|/)(\.env($|\.)|\.npmrc$|node_modules/|dist/|\.pnpm-store/)|\.(zip|tar\.gz|bak|tmp|pem|key|p12|pfx)$' ||
              true
          )"

          if [ -n "${forbidden}" ]; then
            echo "Forbidden tracked files:"
            echo "${forbidden}"
            exit 1
          fi

      - name: Verify source
        run: |
          pnpm exec eslint .
          pnpm test
          pnpm type-check

      - name: Verify proxy page behaviour (headless Chrome)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          echo "chrome: $("$CHROME_BIN" --version 2>&1 || echo 'NOT FOUND')"
          pnpm build
          pnpm test:nebula
          pnpm test:verify

      - name: Build release archives
        run: sh tools/build-archives.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist*.zip
            router-updater.zip
