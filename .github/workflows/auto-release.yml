name: Auto Release

# NebulaDash: 推到 main 就自动出 Release，面板里才能真正“点一下就更新”。
#
# 为什么不用 tag 触发另一个工作流：用 GITHUB_TOKEN 推送的 tag 不会触发新的
# workflow（GitHub 防止递归），所以在同一个 job 里完成“递增版本 → 构建 → 发布”。
# 手动打 tag 的路径仍由 release.yml 负责。
#
# 顺序刻意排成「先构建、后推送」：构建失败时不会留下没产物的 tag。

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'router-updater/**'
      - 'tools/**'
      - 'test/**'
      - '.github/workflows/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # 自动递增产生的那次提交不再触发发布，避免无限循环
    if: |
      !contains(github.event.head_commit.message, '[skip release]') &&
      !startsWith(github.event.head_commit.message, 'chore(release)')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm exec eslint .
          pnpm test
          pnpm type-check

      - name: Verify proxy page behaviour (headless Chrome)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          echo "chrome: $("$CHROME_BIN" --version 2>&1 || echo 'NOT FOUND')"
          pnpm build
          pnpm test:nebula
          pnpm test:verify

      # 版本号由 tag 决定，不回写 package.json —— 这样 CI 不会往 main 里塞提交，
      # 本地也就不用每次发版后 git pull。
      - name: Compute next version
        id: bump
        run: |
          git fetch --tags --force
          last_tag="$(git describe --tags --abbrev=0 --match 'v*-nebula.*' 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            version="$(node tools/next-version.mjs "$last_tag")"
          else
            version="$(node tools/next-version.mjs)"
          fi
          echo "last=${last_tag:-none}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Next release: v${version}"

      - name: Release preflight
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: pnpm release:check

      - name: Build release archives
        env:
          APP_VERSION: ${{ steps.bump.outputs.version }}
        run: sh tools/build-archives.sh

      # 只创建 tag，不提交任何文件
      - name: Create release tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${{ steps.bump.outputs.tag }}" -m "NebulaDash ${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            dist*.zip
            router-updater.zip
